name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    name: PHP ${{ matrix.php }}, Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        # 12.10 is the oldest Laravel a monitored app runs (Takedown Webhooks).
        laravel: ['12.10.*', '12.*', '13.*']
        exclude:
          - php: '8.2'
            laravel: '13.*'
        include:
          # Composer refuses Laravel below 12.69 (published security advisories), so this
          # row turns that check off. Laravel 12.10 also predates Symfony Console 7.4's
          # addCommand(), which leaves artisan commands without the app, so it keeps 7.3.
          - laravel: '12.10.*'
            testbench: '^10.0'
            extra-dev: 'symfony/console:7.3.*'
            update-flags: '--no-blocking'
          - laravel: '12.*'
            testbench: '^10.0'
          - laravel: '13.*'
            testbench: '^11.0'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, sqlite3, redis
          tools: composer:v2
          coverage: none

      - name: Install Dependencies
        run: |
          composer require "illuminate/support:${{ matrix.laravel }}" --no-update --no-interaction
          composer require "orchestra/testbench:${{ matrix.testbench }}" --dev --no-update --no-interaction
          if [ -n "${{ matrix.extra-dev }}" ]; then
            composer require "${{ matrix.extra-dev }}" --dev --no-update --no-interaction
          fi
          composer update --prefer-dist --no-interaction --no-progress ${{ matrix.update-flags }}

      - name: Tests
        run: vendor/bin/pest

  mysql:
    name: MySQL and Redis
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: testing
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, redis
          tools: composer:v2
          coverage: none

      - name: Install Dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Tests
        run: vendor/bin/pest
        env:
          UPKEEP_TEST_DB: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: testing
          DB_USERNAME: root
          DB_PASSWORD: password
          REDIS_HOST: 127.0.0.1

  quality:
    name: Pint and PHPStan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Install Dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Pint
        run: composer lint:check

      - name: PHPStan
        run: composer stan
